          modules: 'debug_info qtcharts qtdatavis3d qtnetworkauth qtpurchasing qtscript qtvirtualkeyboard qtwebengine qtwebglplugin'

      # Retrieve Ccache
      - name: Retrieve ccache
        uses: actions/cache@v4
        with:
