 # Mac builds on Catalina VM
  macos_build:
    name: macOS
    runs-on: macos-14
    env:
      LABEL: osx
      CCACHE_DIR: $GITHUB_WORKSPACE/.ccache
    steps:
      - uses: actions/checkout@v4

      # Checkout repository and submodules
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Fetch Dependencies
      - name: Dependencies
        run: |
          brew install --force ccache cmake openssl@3

       # Install Boost
      - name: Install Boost
        run: |
          curl -fL -o boost_1_80_0.tar.bz2 https://archives.boost.io/release/1.80.0/source/boost_1_80_0.tar.bz2
          tar -xjf boost_1_80_0.tar.bz2
          cd boost_1_80_0
          ./bootstrap.sh
          ./b2
          cd ..

      # Retrieve ccache
      - name: Retrieve ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-osx

       # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          archives: 'qtbase qtdeclarative qtwebengine qtwebchannel qtpositioning qtserialport qtwebsockets qtshadertools'

      # Configure project with cmake
      - name: Configure
        run: |
          mkdir build && cd build
          cmake -D BOOST_ROOT=${{ github.workspace }}/boost_1_80_0 -D BOOST_LIBRARYDIR=${{ github.workspace }}/boost_1_80_0/stage/lib -D OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 -D BUILD_GUI=TRUE -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTS=OFF ..

      # Build for macOS
      - name: Build
        run: |
          cd build
          make

       # Prepare for deploy
      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src
          ls
          TARGETS="pdcd connectivity_tool simplewallet"
          if [[ "${LABEL}" != "aarch64" ]]; then strip ${TARGETS}; fi
          rm -rf Pdc-Gui-${TAG}
          mkdir Pdc-Gui-${TAG}
          cp ${TARGETS} Pdc-Gui-${TAG}/
          tar cvfz Pdc-Gui-${TAG}-${LABEL}.tar.gz Pdc-Gui-${TAG}/

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.tar.gz
          asset_content_type: application/gzip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Pdc-Gui-${{ github.sha }}


  # Windows 10
  windows_build:
    name: Windows
    runs-on: windows-2022
    env:
      MSBUILD_PATH: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin"
      LABEL: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Checkout repository and submodules
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Install OpenSSL
      - name: Install OpenSSL
        run: choco install openssl -y

      # Install QT
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.12.12'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2017_64'
          modules: 'debug_info qtcharts qtdatavis3d qtnetworkauth qtpurchasing qtscript qtvirtualkeyboard qtwebengine qtwebglplugin'

      # Install boost
      - name: Install Boost 1.82.0
        run: |
          $link = "https://boost.teeks99.com/bin/1.82.0/boost_1_82_0-msvc-14.3-64.exe"
          $path = "C:\boost.exe"
          [Net.WebClient]::new().DownloadFile($link, $path)
          Start-Process C:\boost.exe -ArgumentList "/DIR=C:\local\boost_1_82_0","/VERYSILENT" -Wait
          Get-ChildItem C:\local\boost_1_82_0

      # Configure project with cmake
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -T host=x64 .. -DBUILD_GUI=ON -D BOOST_ROOT=C:/local/boost_1_82_0 -D BOOST_LIBRARYDIR="C:/local/boost_1_82_0/lib64-msvc-14.3" -D OPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64" -D STATIC=OFF
          dir

      # Build for Windows
      - name: Build
        run: |
          $env:PATH = "$env:PATH;$env:MSBUILD_PATH"
          cd build
          dir
          MSBuild Pdc.sln /p:Configuration=Release /t:Build

      # Prepare for deploy
      - name: Prepare for Deploy
        shell: bash
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build/src/Release
          rm -rf Pdc-Gui-${TAG}
          mkdir Pdc-Gui-${TAG}
          dir
          cp Pdc.exe Pdc-Gui-${TAG}/
          D:/a/Pdc/Qt/5.12.12/msvc2017_64/bin/windeployqt.exe Pdc-Gui-${TAG}/Pdc.exe
          cp -r ../../../src/gui/qt-daemon/layout/html Pdc-Gui-${TAG}/html
          7z a Pdc-Gui-${TAG}-${LABEL}.zip Pdc-Gui-${TAG}
          cp ../../../utils/buildings/windows/64bit/setup_64.iss Pdc-Gui-${TAG}
          cp ../../../utils/buildings/windows/64bit/vc_redist.x64.exe Pdc-Gui-${TAG}

      # Upload to GH Release
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Release/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.zip
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.zip
          asset_content_type: application/zip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}
          path: ./build/src/Release/Pdc-Gui-${{ github.sha }}

      # Compile .ISS to .EXE Installer - No Release
      - name: Compile .ISS to .EXE Installer - No Release
        if: github.event_name != 'release' && !(startsWith(github.ref, 'refs/tags/'))
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: build/src/Release/Pdc-Gui-${{ github.sha }}/setup_64.iss
          options: /O+ /DBinariesPath=..\Pdc-Gui-${{ github.sha }} /O..\Pdc\build\src\Release /FPdc-Gui-${{ github.sha }}-${{ env.LABEL }}

      # Compile .ISS to .EXE Installer - Release
      - name: Compile .ISS to .EXE Installer - Release
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: build/src/Release/Pdc-Gui-${{ github.event.release.tag_name }}/setup_64.iss
          options: /O+ /DBinariesPath=..\Pdc-Gui-${{ github.event.release.tag_name }} /O..\Pdc\build\src\Release /FPdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}

      # Upload to GH Actions Artifacts EXE
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}.exe
          path: ./build/src/Release/Pdc-Gui-${{ github.sha }}-${{ env.LABEL }}.exe

      # Upload to GH Release EXE
      - name: Upload to GH Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/src/Release/Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.exe
          asset_name: Pdc-Gui-${{ github.event.release.tag_name }}-${{ env.LABEL }}.exe
          asset_content_type: application/octet-stream
